        <circle r="48" fill="none" stroke="#8D97A8" stroke-width="3" />
        <g stroke="#C7CEDA" stroke-width="3.5" stroke-linecap="round">
          <line x1="-48" y1="0" x2="48" y2="0" />
          <line x1="-41.6" y1="-24" x2="41.6" y2="24" />
          <line x1="-24" y1="-41.6" x2="24" y2="41.6" />
          <line x1="0" y1="-48" x2="0" y2="48" />
        </g>
        <circle cx="40" cy="0" r="2.6" fill="#59637A" />
      </g>
      <circle r="6.5" fill="#39404E" />
    </g>

    
    <g id="cloud" fill="#FFFFFF" opacity="0.92">
      <ellipse cx="0" cy="0" rx="36" ry="19" />
