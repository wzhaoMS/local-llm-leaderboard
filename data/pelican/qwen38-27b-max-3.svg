<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican pedals a red bicycle along a road, with spinning wheels, moving pedaling legs, and scrolling scenery.</desc>

  <defs>
