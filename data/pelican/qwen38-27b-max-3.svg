      <circle cx="0" cy="396" r="30" fill="#4E9B5A" />
      <circle cx="-20" cy="410" r="17" fill="#4E9B5A" />
      <circle cx="20" cy="410" r="17" fill="#4E9B5A" />
    </g>

    <g id="bush" fill="#3F8A4C">
      <ellipse cx="0" cy="442" rx="26" ry="12" />
      <ellipse cx="20" cy="445" rx="15" ry="8" />
    </g>
  </defs>

  
  <rect width="800" height="500" fill="url(#sky)" />

  
  <g transform="translate(95 88)">
    <g stroke="#FFD54A" stroke-width="6" stroke-linecap="round">
