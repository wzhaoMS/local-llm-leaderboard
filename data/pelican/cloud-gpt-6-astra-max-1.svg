      <stop stop-color="#fff9e8" />
      <stop offset="1" stop-color="#ffe0ad" />
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#a5d6c9" />
      <stop offset="1" stop-color="#70b6af" />
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2=".65" y2="1">
      <stop stop-color="#fffff7" />
      <stop offset=".6" stop-color="#fffdf0" />
      <stop offset="1" stop-color="#dce9e1" />
    </linearGradient>
    <linearGradient id="pouch" x2=".2" y2="1">
      <stop stop-color="#ffe3a5" />
      <stop offset="1" stop-color="#eaa06d" />
    </linearGradient>

