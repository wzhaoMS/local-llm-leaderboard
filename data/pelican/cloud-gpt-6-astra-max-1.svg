<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" stroke-linecap="round" stroke-linejoin="round">
  <title id="title">Pelican pedal parade</title>
  <desc id="desc">A cheerful pelican in a cycling cap pedals a coral bicycle along the seaside. Its webbed feet turn the pedals, wheels spin, a scarf flutters, and the coastal path rolls past.</desc>

  <defs>
