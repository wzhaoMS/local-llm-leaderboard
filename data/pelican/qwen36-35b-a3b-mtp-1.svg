<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pedalL {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(80deg); }
        50% { transform: rotate(180deg); }
        75% { transform: rotate(260deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pedalR {
        0% { transform: rotate(180deg); }
        25% { transform: rotate(260deg); }
        50% { transform: rotate(360deg); }
        75% { transform: rotate(80deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes wingFlap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }
      @keyframes moveRoad {
        from { transform: translateX(0); }
        to { transform: translateX(-200px); }
      }
      @keyframes moveCloud {
        from { transform: translateX(900px); }
        to { transform: translateX(-300px); }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes headBounce {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(2deg); }
      }
      .wheel-back {
        animation: spinCW 1.2s linear infinite;
        transform-origin: 250px 380px;
      }
      .wheel-front {
        animation: spinCW 1.2s linear infinite;
        transform-origin: 580px 380px;
      }
      .pedal-left-leg {
        animation: pedalL 1.2s linear infinite;
        transform-origin: 420px 360px;
      }
      .pedal-right-leg {
        animation: pedalR 1.2s linear infinite;
        transform-origin: 420px 360px;
      }
      .pelican-body {
        animation: bob 0.6s ease-in-out infinite;
      }
      .pelican-head {
        animation: headBounce 1.2s ease-in-out infinite;
        transform-origin: 380px 160px;
      }
      .pelican-wing {
        animation: wingFlap 0.8s ease-in-out infinite;
        transform-origin: 350px 220px;
      }
      .road-line {
        animation: moveRoad 0.8s linear infinite;
      }
      .cloud1 {
        animation: moveCloud 15s linear infinite;
      }
      .cloud2 {
        animation: moveCloud 22s linear infinite;
        animation-delay: -5s;
      }
      .cloud3 {
        animation: moveCloud 18s linear infinite;
        animation-delay: -10s;
      }
      .tree {
        animation: moveCloud 4s linear infinite;
      }
    </style>

    <g id="wheel-spokes">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#333" stroke-width="6" />
      <circle cx="0" cy="0" r="56" fill="none" stroke="#555" stroke-width="2" />
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#999" stroke-width="1.5" />
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#999" stroke-width="1.5" />
      <line x1="-42" y1="-42" x2="42" y2="42" stroke="#999" stroke-width="1.5" />
      <line x1="42" y1="-42" x2="-42" y2="42" stroke="#999" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#777" stroke="#555" stroke-width="2" />
      <circle cx="0" cy="-30" r="3" fill="#aaa" />
      <circle cx="0" cy="30" r="3" fill="#aaa" />
      <circle cx="-30" cy="0" r="3" fill="#aaa" />
      <circle cx="30" cy="0" r="3" fill="#aaa" />
      <circle cx="-21" cy="-21" r="3" fill="#aaa" />
      <circle cx="21" cy="21" r="3" fill="#aaa" />
      <circle cx="21" cy="-21" r="3" fill="#aaa" />
      <circle cx="-21" cy="21" r="3" fill="#aaa" />
    </g>
  </defs>

  
  <rect width="800" height="500" fill="#87CEEB" />
  <rect y="0" width="800" height="350" fill="url(#skyGrad)" opacity="0.3" />

  
  <g class="cloud1" opacity="0.8">
    <ellipse cx="700" cy="80" rx="50" ry="25" fill="white" />
    <ellipse cx="670" cy="75" rx="35" ry="20" fill="white" />
    <ellipse cx="730" cy="78" rx="40" ry="22" fill="white" />
  </g>
  <g class="cloud2" opacity="0.6">
    <ellipse cx="500" cy="120" rx="60" ry="28" fill="white" />
    <ellipse cx="460" cy="115" rx="40" ry="22" fill="white" />
    <ellipse cx="540" cy="118" rx="45" ry="24" fill="white" />
  </g>
  <g class="cloud3" opacity="0.7">
    <ellipse cx="300" cy="60" rx="45" ry="22" fill="white" />
    <ellipse cx="270" cy="55" rx="30" ry="18" fill="white" />
  </g>

  
  <circle cx="700" cy="80" r="40" fill="#FFD700" opacity="0.9" />
  <g opacity="0.4">
    <line x1="700" y1="30" x2="700" y2="15" stroke="#FFD700" stroke-width="3" />
    <line x1="740" y1="45" x2="750" y2="35" stroke="#FFD700" stroke-width="3" />
    <line x1="755" y1="80" x2="770" y2="80" stroke="#FFD700" stroke-width="3" />
    <line x1="740" y1="115" x2="750" y2="125" stroke="#FFD700" stroke-width="3" />
    <line x1="660" y1="45" x2="650" y2="35" stroke="#FFD700" stroke-width="3" />
    <line x1="645" y1="80" x2="630" y2="80" stroke="#FFD700" stroke-width="3" />
    <line x1="660" y1="115" x2="650" y2="125" stroke="#FFD700" stroke-width="3" />
  </g>

  
  <g class="tree" opacity="0.5">
    <rect x="150" y="300" width="12" height="60" fill="#8B4513" />
    <circle cx="156" cy="285" r="30" fill="#228B22" />
    <circle cx="140" cy="295" r="22" fill="#2E8B2E" />
    <circle cx="172" cy="292" r="25" fill="#1E7B1E" />
  </g>
  <g class="tree" opacity="0.4" transform="translate(350, 0)">
    <rect x="150" y="310" width="10" height="50" fill="#8B4513" />
    <circle cx="155" cy="298" r="25" fill="#228B22" />
    <circle cx="142" cy="305" r="18" fill="#2E8B2E" />
  </g>
  <g class="tree" opacity="0.6" transform="translate(650, 0)">
    <rect x="150" y="295" width="14" height="65" fill="#8B4513" />
    <circle cx="157" cy="275" r="35" fill="#228B22" />
    <circle cx="138" cy="288" r="25" fill="#2E8B2E" />
    <circle cx="176" cy="285" r="28" fill="#1E7B1E" />
  </g>

  
  <rect y="380" width="800" height="120" fill="#666" />
  <rect y="375" width="800" height="8" fill="#888" />
  <rect y="490" width="800" height="10" fill="#555" />

  
  <g class="road-line">
    <rect x="0" y="440" width="80" height="6" rx="3" fill="#FFD700" />
    <rect x="200" y="440" width="80" height="6" rx="3" fill="#FFD700" />
    <rect x="400" y="440" width="80" height="6" rx="3" fill="#FFD700" />
    <rect x="600" y="440" width="80" height="6" rx="3" fill="#FFD700" />
    <rect x="800" y="440" width="80" height="6" rx="3" fill="#FFD700" />
  </g>

  
  
  <g transform="translate(250, 380)">
    <use href="#wheel-spokes" class="wheel-back" />
  </g>

  
  <g transform="translate(580, 380)">
    <use href="#wheel-spokes" class="wheel-front" />
  </g>

  
  <g stroke="#CC0000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <line x1="420" y1="360" x2="400" y2="260" />
    
    <line x1="420" y1="360" x2="250" y2="380" />
    
    <line x1="400" y1="260" x2="390" y2="230" />
    
    <line x1="390" y1="230" x2="250" y2="380" />
    
    <line x1="400" y1="260" x2="530" y2="260" />
    
    <line x1="400" y1="260" x2="530" y2="360" />
    
    <line x1="530" y1="260" x2="580" y2="380" />
    
    <line x1="530" y1="260" x2="530" y2="210" />
  </g>

  
  <path d="M510 210 Q520 195 540 200 Q550 203 545 215" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" />

  
  <path d="M360 230 Q375 220 395 225 Q405 228 400 235 Q390 240 370 237 Z" fill="#333" stroke="#222" stroke-width="1" />
  <line x1="390" y1="230" x2="390" y2="240" stroke="#333" stroke-width="4" />

  
  <g>
    
    <circle cx="420" cy="360" r="18" fill="none" stroke="#666" stroke-width="3" />
    <circle cx="420" cy="360" r="5" fill="#888" />

    
    <g class="pedal-left-leg">
      <line x1="420" y1="360" x2="440" y2="340" stroke="#555" stroke-width="4" />
      <rect x="430" y="332" width="22" height="8" rx="3" fill="#444" />
    </g>

    
    <g class="pedal-right-leg">
      <line x1="420" y1="360" x2="400" y2="380" stroke="#555" stroke-width="4" />
      <rect x="390" y="375" width="22" height="8" rx="3" fill="#444" />
    </g>
  </g>

  
  <path d="M420 342 L250 380" stroke="#666" stroke-width="2" stroke-dasharray="4,3" opacity="0.6" />
  <path d="M420 378 L250 380" stroke="#666" stroke-width="2" stroke-dasharray="4,3" opacity="0.6" />

  
  <g class="pelican-body">
    
    <g class="pedal-right-leg">
      <path d="M410 290 Q400 320 400 370" stroke="#F4A460" stroke-width="5" fill="none" stroke-linecap="round" />
    </g>

    
