    <ellipse cx="340" cy="250" rx="35" ry="25" fill="#f0f0f0" stroke="#ccc" stroke-width="1" />
    <path d="M310 245 Q330 235 360 240 Q370 245 365 255" fill="#e8e8e8" stroke="#ccc" stroke-width="1" />

    
    <g class="pelican-wing">
      <ellipse cx="370" cy="255" rx="30" ry="22" fill="white" stroke="#ddd" stroke-width="1" />
      <path d="M345 248 Q360 240 385 245 Q395 250 390 260" fill="white" stroke="#ddd" stroke-width="1" />
    </g>

    
    <path d="M315 270 Q290 280 280 290 Q295 285 310 280" fill="white" stroke="#ddd" stroke-width="1" />
    <path d="M312 265 Q285 270 275 282 Q290 278 308 272" fill="#f5f5f5" stroke="#ddd" stroke-width="1" />

    
    <path d="M380 240 Q390 210 385 190 Q380 175 380 160" stroke="white" stroke-width="22" fill="none" stroke-linecap="round" />
    <path d="M380 240 Q390 210 385 190 Q380 175 380 160" stroke="#f0f0f0" stroke-width="18" fill="none" stroke-linecap="round" />

    
    <g class="pelican-head">
      
      <circle cx="382" cy="148" r="22" fill="white" stroke="#ddd" stroke-width="1" />

      
      <circle cx="395" cy="142" r="5" fill="white" stroke="#333" stroke-width="1.5" />
      <circle cx="396" cy="142" r="3" fill="#111" />
      <circle cx="397" cy="141" r="1" fill="white" />

      
      <path d="M400 140 Q430 135 460 138 Q475 140 470 148 Q450 150 420 152 Q405 153 400 148" fill="#FFB347" stroke="#E8963A" stroke-width="1" />

      
      <path d="M400 148 Q420 155 445 152 Q465 148 468 152 Q465 175 440 180 Q415 182 400 170 Z" fill="#FFB347" stroke="#E8963A" stroke-width="1" opacity="0.9" />

      
      <path d="M405 152 Q430 168 455 155" fill="none" stroke="#E8963A" stroke-width="1" opacity="0.6" />

      
      <ellipse cx="420" cy="140" rx="2" ry="1.5" fill="#E8963A" />
    </g>
  </g>

  
  <g opacity="0.3" stroke="#999" stroke-width="2" stroke-linecap="round">
    <line x1="200" y1="400" x2="180" y2="400">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="210" y1="415" x2="185" y2="415">
      <animate attributeName="opacity" values="0;0.4;0" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="530" y1="400" x2="510" y2="400">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="540" y1="415" x2="515" y2="415">
      <animate attributeName="opacity" values="0;0.4;0" dur="0.5s" repeatCount="indefinite" />
    </line>
  </g>

  
  <g class="cloud1" transform="translate(0, 50)">
    <path d="M500 50 Q510 40 520 48 Q530 40 540 50" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" />
    <animate attributeName="opacity" values="0;0.6;0.8;0.6;0" dur="4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="600,30; -100,20; 600,30" dur="12s" repeatCount="indefinite" />
  </g>
</svg>