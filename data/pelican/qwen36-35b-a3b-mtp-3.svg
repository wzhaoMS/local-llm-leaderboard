<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .road-line { stroke-dasharray: 40 40; }
    </style>
  </defs>

  
  <rect width="800" height="320" fill="#87CEEB" />
  
  
  <rect y="320" width="800" height="280" fill="#90EE90" />
  
  
  <rect y="440" width="800" height="160" fill="#666" />
  <line x1="0" y1="520" x2="800" y2="520" class="road-line" stroke="#FFF" stroke-width="6">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1s" repeatCount="indefinite" />
  </line>

  
  <g fill="#fff" opacity="0.85">
    <circle cx="120" cy="90" r="25" /><circle cx="150" cy="75" r="35" /><circle cx="180" cy="85" r="28" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="10s" repeatCount="indefinite" />
  </g>
  <g fill="#fff" opacity="0.6">
    <circle cx="550" cy="140" r="20" /><circle cx="575" cy="125" r="30" /><circle cx="600" cy="135" r="22" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite" />
  </g>

  
  <ellipse cx="400" cy="485" rx="240" ry="12" fill="rgba(0,0,0,0.2)" />

  
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 200 400" to="360 200 400" dur="2s" repeatCount="indefinite" />
    <circle cx="200" cy="400" r="78" fill="none" stroke="#222" stroke-width="4" />
    <circle cx="200" cy="400" r="68" fill="none" stroke="#555" stroke-width="2" />
    <path d="M200,322 L200,478 M122,400 L278,400 M145,345 L255,455 M145,455 L255,345" stroke="#888" stroke-width="2" />
    <circle cx="200" cy="400" r="8" fill="#777" />
  </g>

  
  <g>
    
    <line x1="200" y1="400" x2="400" y2="400" stroke="#444" stroke-width="6" />
    
    <line x1="200" y1="400" x2="310" y2="330" stroke="#444" stroke-width="6" />
    
    <line x1="310" y1="330" x2="480" y2="360" stroke="#444" stroke-width="6" />
    
    <line x1="480" y1="360" x2="400" y2="400" stroke="#444" stroke-width="6" />
    
    <line x1="310" y1="330" x2="320" y2="290" stroke="#444" stroke-width="6" />
    
    <line x1="560" y1="270" x2="570" y2="230" stroke="#444" stroke-width="6" />
    <line x1="540" y1="265" x2="580" y2="265" stroke="#444" stroke-width="6" />
    <circle cx="540" cy="265" r="4" fill="#333" />
    <circle cx="580" cy="265" r="4" fill="#333" />
    
    <path d="M295,285 Q310,280 335,285 L340,290 L290,290 Z" fill="#222" />
  </g>

  
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 400" to="360 600 400" dur="2s" repeatCount="indefinite" />
    <circle cx="600" cy="400" r="78" fill="none" stroke="#222" stroke-width="4" />
    <circle cx="600" cy="400" r="68" fill="none" stroke="#555" stroke-width="2" />
    <path d="M600,322 L600,478 M522,400 L678,400 M545,345 L655,455 M545,455 L655,345" stroke="#888" stroke-width="2" />
    <circle cx="600" cy="400" r="8" fill="#777" />
  </g>

  
  <path d="M200,400 Q400,435 400,400" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="5,3" />

  
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="2s" repeatCount="indefinite" />
    
    
    <line x1="400" y1="400" x2="438" y2="378" stroke="#555" stroke-width="6" />
    <rect x="432" y="372" width="12" height="10" fill="#222" rx="2" />
    
    
    <line x1="400" y1="400" x2="362" y2="422" stroke="#555" stroke-width="6" />
    <rect x="356" y="418" width="12" height="10" fill="#222" rx="2" />

    
    <g transform="translate(400,400)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite" />
        
        <path d="M0,0 C15,-15 30,-35 25,-55 L35,-55 C40,-35 25,-15 5,0 Z" fill="#f4a460" stroke="#d4843e" stroke-width="2" />
        <ellipse cx="30" cy="-55" rx="7" ry="5" fill="#333" transform="rotate(-20 30 -55)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="2s" repeatCount="indefinite" />
        
        <path d="M0,0 C-15,-15 -30,-35 -25,-55 L-35,-55 C-40,-35 -25,-15 -5,0 Z" fill="#f4a460" stroke="#d4843e" stroke-width="2" />
        <ellipse cx="-30" cy="-55" rx="7" ry="5" fill="#333" transform="rotate(20 -30 -55)" />
      </g>
    </g>
  </g>

  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="0.4s" repeatCount="indefinite" />
    
    
    <path d="M290,270 Q260,280 270,300 Q290,290 310,285 Z" fill="#e9ecef" />
    
    
    <ellipse cx="350" cy="265" rx="48" ry="38" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" />
    
    
    <path d="M375,245 Q395,195 385,155" stroke="#f8f9fa" stroke-width="24" fill="none" stroke-linecap="round" />
    
    
    <circle cx="385" cy="150" r="24" fill="#f8f9fa" />
    
    
    <circle cx="393" cy="144" r="3.5" fill="#000" />
    <circle cx="394.5" cy="142.5" r="1.2" fill="#fff" />
    
    
    <path d="M395,142 Q435,138 445,148 L400,155 Z" fill="#ffcc80" />
    
    <path d="M395,150 Q440,165 425,195 Q400,215 390,170 Z" fill="#ffb347" />
    
    <path d="M395,148 Q420,152 435,158" fill="none" stroke="#e69a30" stroke-width="1.5" />
    
    
    <path d="M340,255 Q400,245 460,250" fill="none" stroke="#e9ecef" stroke-width="14" stroke-linecap="round" />
    <path d="M345,265 Q410,260 470,265" fill="none" stroke="#e9ecef" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>