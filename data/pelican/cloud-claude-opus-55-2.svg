<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff" />
      <stop offset="1" stop-color="#e8f7ff" />
    </linearGradient>
    <g id="wheel">
