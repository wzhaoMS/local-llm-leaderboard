      <path d="M290 125 Q310 95 300 70 Q295 55 310 48" stroke="#fafafa" stroke-width="20" fill="none" stroke-linecap="round" />
      <path d="M298 128 Q318 95 308 72" stroke="#bbb" stroke-width="2" fill="none" />
      
