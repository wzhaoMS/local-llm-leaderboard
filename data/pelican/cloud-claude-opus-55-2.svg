        <line x1="-42.5" y1="17.6" x2="42.5" y2="-17.6" />
      </g>
      <circle r="5" fill="#444" />
    </g>
  </defs>

  <rect width="600" height="400" fill="url(#sky)" />
  <circle cx="510" cy="70" r="32" fill="#ffe066" />

  
  <g fill="#fff" opacity="0.9">
