      <animate attributeName="d" dur="1s" repeatCount="indefinite" values="M260 180 L295 225 L285 303;                 M260 180 L310 230 L310 278;                 M260 180 L290 220 L285 253;                 M260 180 L275 225 L260 278;                 M260 180 L295 225 L285 303" />
