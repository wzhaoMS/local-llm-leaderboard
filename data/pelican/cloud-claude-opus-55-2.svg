      <path d="M232 160 Q215 172 205 168" stroke="#333" stroke-width="3" fill="none" />
      
      <path d="M295 140 Q335 145 372 158" stroke="#dcdcdc" stroke-width="12" fill="none" stroke-linecap="round" />
