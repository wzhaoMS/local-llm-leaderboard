        <path d="M302 33 Q312 22 326 30" stroke="#f4d35e" stroke-width="4" fill="none" />
        
        <path d="M330 40 L400 52 L332 52 Z" fill="#f6a623" stroke="#c97c00" stroke-width="2" stroke-linejoin="round" />
        
