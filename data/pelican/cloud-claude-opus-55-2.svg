      <line x1="190" y1="278" x2="255" y2="195" />
      <line x1="255" y1="195" x2="285" y2="278" />
      <line x1="255" y1="195" x2="370" y2="195" />
      <line x1="370" y1="195" x2="285" y2="278" />
      <line x1="400" y1="278" x2="365" y2="170" />
