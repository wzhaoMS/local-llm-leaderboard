      <ellipse cx="20" cy="-8" rx="22" ry="13" />
      <animateTransform attributeName="transform" type="translate" from="350 130" to="-450 130" dur="20s" repeatCount="indefinite" />
    </g>
  </g>

  
  <path d="M0 300 Q120 230 250 290 T520 280 T700 300 V400 H0Z" fill="#7cc576" />
  <rect y="330" width="600" height="70" fill="#666" />
  
  <g stroke="#fff" stroke-width="5" stroke-dasharray="30 30">
    <line x1="-60" y1="368" x2="660" y2="368">
