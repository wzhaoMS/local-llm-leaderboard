<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec3ee" />
      <stop offset="1" stop-color="#e3f4fd" />
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccf6e" />
      <stop offset="1" stop-color="#5aa843" />
    </linearGradient>

    
    <g id="wheel">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite" />
        <circle r="68" fill="none" stroke="#2b2b2b" stroke-width="8" />
        <circle r="58" fill="none" stroke="#9aa0a6" stroke-width="3" />
        <g stroke="#b7bcc2" stroke-width="3.5">
          <line y1="-58" y2="58" />
          <line x1="-58" x2="58" />
          <line x1="-41" y1="-41" x2="41" y2="41" />
          <line x1="-41" y1="41" x2="41" y2="-41" />
        </g>
        <circle r="9" fill="#5f6368" />
        <circle cx="0" cy="-30" r="4" fill="#fff" opacity="0.9" />
      </g>
    </g>

    
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="42" ry="20" />
      <ellipse cx="30" cy="-10" rx="30" ry="17" />
      <ellipse cx="-30" cy="-6" rx="26" ry="15" />
    </g>
  </defs>

  
  <rect width="800" height="500" fill="url(#sky)" />

  
  <g transform="translate(92,86)">
    <g stroke="#ffd54f" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
      <line y1="-58" y2="-74" /><line y1="58" y2="74" />
      <line x1="-58" x2="-74" /><line x1="58" x2="74" />
      <line x1="-41" y1="-41" x2="-52" y2="-52" /><line x1="41" y1="41" x2="52" y2="52" />
      <line x1="-41" y1="41" x2="-52" y2="52" /><line x1="41" y1="-41" x2="52" y2="-52" />
    </g>
    <circle r="44" fill="#ffe066" />
  </g>

  
  <g opacity="0.95">
    <use href="#cloud" y="80">
      <animate attributeName="x" values="0" dur="0s" />
      <animateTransform attributeName="transform" type="translate" from="880 0" to="-140 0" dur="26s" repeatCount="indefinite" />
    </use>
    <use href="#cloud" y="150" transform="scale(0.7)">
      <animateTransform attributeName="transform" type="translate" from="1250 0" to="-250 0" dur="34s" repeatCount="indefinite" />
    </use>
    <use href="#cloud" y="55">
      <animateTransform attributeName="transform" type="translate" from="1450 0" to="-150 0" dur="40s" repeatCount="indefinite" />
    </use>
  </g>

  
  <rect y="448" width="800" height="52" fill="url(#grass)" />
  <rect y="444" width="800" height="10" fill="#6b6f76" />
  <line x1="0" y1="449" x2="800" y2="449" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="34 26">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.35s" repeatCount="indefinite" />
  </line>

  
  <g stroke="#9fcfe8" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="220" x2="180" y2="220">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="40 0" to="-60 0" dur="0.9s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="260" x2="170" y2="260">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="40 0" to="-60 0" dur="0.9s" begin="0.3s" repeatCount="indefinite" />
    </line>
    <line x1="130" y1="300" x2="185" y2="300">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.6s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="40 0" to="-60 0" dur="0.9s" begin="0.6s" repeatCount="indefinite" />
    </line>
  </g>

  
  
  <use href="#wheel" x="262" y="378" />
  <use href="#wheel" x="540" y="378" />

  
  <g stroke="#d9363e" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M262,378 L388,378 L344,262 Z" />
    <path d="M388,378 L492,262" />
    <path d="M344,262 L492,262" />
    <path d="M492,262 L540,378" />
  </g>
  
  <line x1="344" y1="262" x2="338" y2="242" stroke="#333" stroke-width="7" />
  <path d="M312,242 Q338,228 364,242 Q338,250 312,242 Z" fill="#333" />
  
  <line x1="492" y1="262" x2="494" y2="238" stroke="#333" stroke-width="7" />
  <path d="M474,232 Q494,222 514,236" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />

  
  <g transform="translate(388,378)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#444" stroke-width="7" stroke-linecap="round" />
      
      <g transform="translate(36,0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" />
        <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#222" />
        <ellipse cx="0" cy="-12" rx="17" ry="8" fill="#f2a83b" />
        <path d="M10,-16 l10,-3 -8,8 z" fill="#e88f2a" />
      </g>
      
      <g transform="translate(-36,0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite" />
        <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#222" />
        <ellipse cx="0" cy="-12" rx="17" ry="8" fill="#f2a83b" />
        <path d="M10,-16 l10,-3 -8,8 z" fill="#e88f2a" />
      </g>
    </g>
    <circle r="8" fill="#666" />
  </g>

  
  <path d="M262,388 Q325,404 380,386" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="5 4" />

  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.6s" repeatCount="indefinite" />

    
    <path d="M368,268 Q372,320 388,352" fill="none" stroke="#f2a83b" stroke-width="7" stroke-linecap="round" />

    
    <path d="M300,225 L258,208 L266,232 L252,238 L300,248 Z" fill="#eef3f7" stroke="#c9d4dd" stroke-width="2" />

    
    <ellipse cx="368" cy="222" rx="72" ry="50" fill="#ffffff" stroke="#c9d4dd" stroke-width="3" />

    
    <path d="M418,196 Q436,150 452,132 Q462,120 476,122 L492,140 Q470,158 458,186 Q448,212 430,226 Z" fill="#ffffff" stroke="#c9d4dd" stroke-width="3" />

    
    <circle cx="478" cy="128" r="26" fill="#ffffff" stroke="#c9d4dd" stroke-width="3" />
    
    <path d="M466,106 Q468,92 478,88 Q474,98 480,102" fill="none" stroke="#c9d4dd" stroke-width="3" stroke-linecap="round" />

    
    <path d="M498,120 Q566,112 596,126 Q560,134 500,132 Z" fill="#f2a83b" stroke="#d98e26" stroke-width="2" />
    <path d="M500,132 Q560,136 596,126 Q572,172 522,164 Q502,156 500,132 Z" fill="#ffb84d" stroke="#d98e26" stroke-width="2" />
    <path d="M506,140 Q546,156 586,130" fill="none" stroke="#e8a33d" stroke-width="2.5" />
    
    <circle cx="546" cy="122" r="2.5" fill="#b5731f" />

    
    <circle cx="486" cy="120" r="6" fill="#222" />
    <circle cx="488" cy="118" r="2" fill="#fff" />

    
    <g transform="translate(360,208)">
      <animateTransform attributeName="transform" type="rotate" values="0;-16;0" dur="0.6s" repeatCount="indefinite" additive="sum" />
      <path d="M0,0 Q-46,-8 -74,26 Q-34,34 -2,22 Z" fill="#eef3f7" stroke="#c9d4dd" stroke-width="3" />
      <path d="M-14,10 Q-40,12 -58,26" fill="none" stroke="#c9d4dd" stroke-width="2" />
      <path d="M-8,18 Q-30,22 -44,30" fill="none" stroke="#c9d4dd" stroke-width="2" />
    </g>

    
    <path fill="#4f86d6" stroke="#3a6bb5" stroke-width="2">
      <animate attributeName="d" values="M452,168 Q470,176 462,188 Q430,196 396,186 Q368,180 344,190 Q376,200 410,198 Q448,196 458,182 Z;                 M452,168 Q470,176 462,188 Q430,192 396,192 Q366,196 340,182 Q374,206 410,202 Q448,200 458,182 Z;                 M452,168 Q470,176 462,188 Q430,196 396,186 Q368,180 344,190 Q376,200 410,198 Q448,196 458,182 Z" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M446,162 Q458,158 464,170 Q452,178 444,170 Z" fill="#4f86d6" stroke="#3a6bb5" stroke-width="2" />
  </g>

  
  <g fill="#3f8f34">
    <path d="M60,452 l6,-14 6,14 z">
      <animateTransform attributeName="transform" type="translate" from="820 0" to="-860 0" dur="2.2s" repeatCount="indefinite" />
    </path>
    <path d="M260,452 l6,-12 6,12 z">
