<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
    <defs>
        
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#87CEEB" />
            <stop offset="100%" stop-color="#E0F7FA" />
        </linearGradient>
        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5D4037" />
            <stop offset="100%" stop-color="#3E2723" />
        </linearGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#424242" />
            <stop offset="100%" stop-color="#212121" />
        </linearGradient>
        
        
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="4" dy="8" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
        </filter>
    </defs>

    
    <rect width="1000" height="700" fill="url(#skyGrad)" />
    
    
    <circle cx="850" cy="150" r="60" fill="#FFD700" opacity="0.9" />
    <circle cx="850" cy="150" r="80" fill="#FFD700" opacity="0.3" />

    
    <g opacity="0.8">
        <path d="M 100 100 Q 120 80 150 100 Q 180 80 200 100 Q 220 80 240 100 L 240 130 L 100 130 Z" fill="#FFF" />
        <animateTransform attributeName="transform" type="translate" values="0 0; -100 0; 0 0" dur="20s" repeatCount="indefinite" />
    </g>
    <g opacity="0.6">
        <path d="M 400 150 Q 430 120 470 150 Q 500 120 530 150 Q 560 120 590 150 L 590 180 L 400 180 Z" fill="#FFF" />
        <animateTransform attributeName="transform" type="translate" values="0 0; -150 0; 0 0" dur="25s" repeatCount="indefinite" />
    </g>

    
    <rect y="550" width="1000" height="150" fill="url(#groundGrad)" />
    
    
    <rect y="600" width="1000" height="100" fill="url(#roadGrad)" />
    
    
    <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="1s" repeatCount="indefinite" />
        <rect x="100" y="640" width="80" height="10" fill="#FFF" rx="5" />
        <rect x="300" y="640" width="80" height="10" fill="#FFF" rx="5" />
        <rect x="500" y="640" width="80" height="10" fill="#FFF" rx="5" />
        <rect x="700" y="640" width="80" height="10" fill="#FFF" rx="5" />
        <rect x="900" y="640" width="80" height="10" fill="#FFF" rx="5" />
        <rect x="1100" y="640" width="80" height="10" fill="#FFF" rx="5" />
    </g>

    
    <g stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.4">
        <line x1="900" y1="300" x2="800" y2="300">
            <animate attributeName="x1" values="1000; 0" dur="0.8s" repeatCount="indefinite" />
            <animate attributeName="x2" values="900; -100" dur="0.8s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="0.8s" repeatCount="indefinite" />
        </line>
        <line x1="850" y1="450" x2="750" y2="450">
            <animate attributeName="x1" values="1000; 0" dur="1s" repeatCount="indefinite" />
            <animate attributeName="x2" values="900; -100" dur="1s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="1s" repeatCount="indefinite" />
        </line>
        <line x1="800" y1="200" x2="700" y2="200">
            <animate attributeName="x1" values="1000; 0" dur="0.6s" repeatCount="indefinite" />
            <animate attributeName="x2" values="900; -100" dur="0.6s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="0.6s" repeatCount="indefinite" />
        </line>
    </g>

    
    <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.5s" repeatCount="indefinite" />

        
        <ellipse cx="480" cy="590" rx="180" ry="15" fill="#000" opacity="0.3" />

        
        <g id="rear-wheel">
            <circle cx="300" cy="520" r="70" fill="none" stroke="#212121" stroke-width="12" />
            <circle cx="300" cy="520" r="64" fill="none" stroke="#757575" stroke-width="4" />
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 300 520" to="360 300 520" dur="1.2s" repeatCount="indefinite" />
                <line x1="300" y1="456" x2="300" y2="584" stroke="#BDBDBD" stroke-width="3" />
                <line x1="236" y1="520" x2="364" y2="520" stroke="#BDBDBD" stroke-width="3" />
                <line x1="255" y1="475" x2="345" y2="565" stroke="#BDBDBD" stroke-width="3" />
                <line x1="255" y1="565" x2="345" y2="475" stroke="#BDBDBD" stroke-width="3" />
                <circle cx="300" cy="520" r="8" fill="#9E9E9E" />
            </g>
        </g>

        
        <g id="front-wheel">
            <circle cx="650" cy="520" r="70" fill="none" stroke="#212121" stroke-width="12" />
            <circle cx="650" cy="520" r="64" fill="none" stroke="#757575" stroke-width="4" />
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 650 520" to="360 650 520" dur="1.2s" repeatCount="indefinite" />
                <line x1="650" y1="456" x2="650" y2="584" stroke="#BDBDBD" stroke-width="3" />
                <line x1="586" y1="520" x2="714" y2="520" stroke="#BDBDBD" stroke-width="3" />
                <line x1="605" y1="475" x2="695" y2="565" stroke="#BDBDBD" stroke-width="3" />
                <line x1="605" y1="565" x2="695" y2="475" stroke="#BDBDBD" stroke-width="3" />
                <circle cx="650" cy="520" r="8" fill="#9E9E9E" />
            </g>
        </g>

        
        <g id="frame" stroke="#D32F2F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            
            <line x1="400" y1="390" x2="420" y2="480" />
            
            <line x1="300" y1="520" x2="420" y2="480" />
            
            <line x1="420" y1="480" x2="630" y2="380" />
            
            <line x1="400" y1="390" x2="630" y2="380" />
            
            <line x1="300" y1="520" x2="400" y2="390" />
            
            <line x1="630" y1="380" x2="650" y2="520" />
            
            <line x1="620" y1="410" x2="640" y2="360" stroke-width="14" />
            
            <path d="M 640 360 Q 670 350 680 380 L 690 390" fill="none" stroke="#B71C1C" stroke-width="8" />
            
            <line x1="400" y1="390" x2="390" y2="350" stroke="#333" stroke-width="6" />
        </g>

        
        <path d="M 360 350 Q 390 340 410 350 L 400 360 Q 380 360 360 350 Z" fill="#212121" />

        
        <g id="drivetrain">
            
            <circle cx="420" cy="480" r="24" fill="none" stroke="#757575" stroke-width="6" />
            <circle cx="420" cy="480" r="4" fill="#9E9E9E" />
            
            
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 420 480" to="360 420 480" dur="1.5s" repeatCount="indefinite" />
                <line x1="420" y1="480" x2="420" y2="520" stroke="#424242" stroke-width="8" stroke-linecap="round" />
                
                <rect x="405" y="515" width="30" height="10" rx="4" fill="#212121" />
                
                <line x1="420" y1="480" x2="420" y2="440" stroke="#616161" stroke-width="6" stroke-linecap="round" />
                
                <rect x="405" y="435" width="30" height="10" rx="4" fill="#212121" />
            </g>
        </g>

        
        
        <path d="M 380 400 L 390 450 L 415 460" fill="none" stroke="#FFA000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" values="M 380 400 L 390 450 L 415 460;M 380 400 L 370 450 L 390 485;M 380 400 L 390 450 L 415 460" dur="1.5s" repeatCount="indefinite" />
        </path>
        
        <path d="M 400 420 L 410 480 L 430 490" fill="none" stroke="#FFC107" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" values="M 400 420 L 410 480 L 430 490;M 400 420 L 390 480 L 415 515;M 400 420 L 410 480 L 430 490" dur="1.5s" repeatCount="indefinite" />
        </path>

        
        <g id="pelican">
            
            <ellipse cx="420" cy="340" rx="85" ry="65" fill="#FAFAFA" filter="url(#shadow)" />
            <ellipse cx="420" cy="340" rx="85" ry="65" fill="none" stroke="#E0E0E0" stroke-width="3" />
            
            
            <path d="M 340 330 Q 300 320 310 360 Q 330 370 350 360 Z" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2" />
            
            
            <g>
                <animateTransform attributeName="transform" type="rotate" values="-5 380 320; 15 380 320; -5 380 320" dur="0.6s" repeatCount="indefinite" />
                <path d="M 380 320 Q 320 300 330 380 Q 370 390 400 370 Z" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="3" />
                
                <path d="M 340 340 Q 360 330 380 360" fill="none" stroke="#BDBDBD" stroke-width="2" />
                <path d="M 335 355 Q 355 345 380 370" fill="none" stroke="#BDBDBD" stroke-width="2" />
            </g>

            
            <path d="M 460 310 Q 500 220 480 160 Q 470 140 450 150 Q 440 180 440 220 Q 430 260 420 300" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="4" />
            
            
            <circle cx="480" cy="160" r="28" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="3" />
            
            
            <circle cx="495" cy="155" r="6" fill="#212121" />
            <circle cx="497" cy="153" r="2" fill="#FFF" />
            
            
            <path d="M 500 165 L 590 175 L 570 190 L 505 180 Z" fill="#FFCA28" stroke="#FFA000" stroke-width="2" />
            
            
            <path d="M 500 180 Q 560 200 550 240 Q 520 250 505 210 Q 495 190 500 180 Z" fill="#FF9800" stroke="#F57C00" stroke-width="2" />
            
            
            <path d="M 500 180 L 505 210 Q 520 250 550 240" fill="none" stroke="#E65100" stroke-width="3" />

            
            <path d="M 455 140 Q 480 115 505 140 L 510 155 Q 480 145 450 155 Z" fill="#F44336" />
            <rect x="470" y="130" width="20" height="8" rx="4" fill="#212121" />
        </g>
    </g>

    
    <g fill="#BCAAA4" opacity="0.6">
        <circle cx="250" cy="580" r="4">
            <animate attributeName="cx" values="250; 150" dur="0.5s" repeatCount="indefinite" />
            <animate attributeName="cy" values="580; 560" dur="0.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="0.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="220" cy="590" r="6">
            <animate attributeName="cx" values="220; 120" dur="0.6s" repeatCount="indefinite" />
            <animate attributeName="cy" values="590; 570" dur="0.6s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="0.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="280" cy="570" r="3">
            <animate attributeName="cx" values="280; 180" dur="0.4s" repeatCount="indefinite" />
            <animate attributeName="cy" values="570; 550" dur="0.4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.6; 0" dur="0.4s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>