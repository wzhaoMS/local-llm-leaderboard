<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2" />
      <stop offset="1" stop-color="#d9f1ff" />
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc576" />
      <stop offset="1" stop-color="#4e9a4a" />
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="34" ry="16" fill="#fff" />
      <ellipse cx="-22" cy="6" rx="22" ry="12" fill="#fff" />
      <ellipse cx="24" cy="6" rx="24" ry="12" fill="#fff" />
      <ellipse cx="4" cy="-10" rx="20" ry="14" fill="#fff" />
    </g>
    <g id="wheel">
      <circle r="60" fill="none" stroke="#222" stroke-width="8" />
      <circle r="55" fill="none" stroke="#888" stroke-width="2" />
      <g stroke="#aaa" stroke-width="1.6">
        <line x1="-55" y1="0" x2="55" y2="0" />
        <line x1="0" y1="-55" x2="0" y2="55" />
        <line x1="-39" y1="-39" x2="39" y2="39" />
        <line x1="-39" y1="39" x2="39" y2="-39" />
        <line x1="-21" y1="-51" x2="21" y2="51" />
        <line x1="-51" y1="-21" x2="51" y2="21" />
        <line x1="-21" y1="51" x2="21" y2="-51" />
        <line x1="-51" y1="21" x2="51" y2="-21" />
      </g>
      <circle r="6" fill="#555" />
    </g>
  </defs>

  
  <rect width="600" height="400" fill="url(#sky)" />
  <circle cx="510" cy="70" r="36" fill="#ffe066">
    <animate attributeName="r" values="36;39;36" dur="3s" repeatCount="indefinite" />
  </circle>

  
  <use href="#cloud" transform="translate(700 70)">
    <animateTransform attributeName="transform" type="translate" from="700 70" to="-100 70" dur="18s" repeatCount="indefinite" />
  </use>
  <use href="#cloud" transform="translate(300 120) scale(0.7)">
    <animateTransform attributeName="transform" type="translate" from="750 120" to="-80 120" dur="26s" begin="-12s" repeatCount="indefinite" />
  </use>
  <use href="#cloud" transform="translate(500 50)">
    <animateTransform attributeName="transform" type="translate" from="720 45" to="-100 45" dur="22s" begin="-17s" repeatCount="indefinite" />
  </use>

  
  <g>
    <path d="M0,300 Q100,230 200,300 T400,300 T600,300 T800,300 T1000,300 T1200,300 V400 H0 Z" fill="#a8d99a" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="12s" repeatCount="indefinite" />
  </g>

  
  <rect y="355" width="600" height="45" fill="url(#grass)" />
  <rect y="358" width="600" height="20" fill="#8a8a8a" />
  <line x1="0" y1="368" x2="600" y2="368" stroke="#fff" stroke-width="3" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="50" dur="0.4s" repeatCount="indefinite" />
  </line>

  
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="200" x2="160" y2="200">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.6s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="240" x2="150" y2="240">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.2s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.6s" begin="0.2s" repeatCount="indefinite" />
    </line>
    <line x1="125" y1="280" x2="165" y2="280">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.6s" begin="0.4s" repeatCount="indefinite" />
    </line>
  </g>

  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0;0 -2;0 0" dur="1s" repeatCount="indefinite" />

    
    <polyline fill="none" stroke="#c97c00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="265,225 306.7,260.9 268,300">
      <animate attributeName="points" dur="1s" repeatCount="indefinite" values="         265,225 306.7,260.9 268,300;         265,225 315.2,247.5 274.4,284.4;         265,225 319.5,231.6 290,278;         265,225 319.7,231.2 305.6,284.4;         265,225 316.2,245.1 312,300;         265,225 307,260.6 305.6,315.6;         265,225 299.5,267.8 290,322;         265,225 300.4,267.1 274.4,315.6;         265,225 306.7,260.9 268,300" />
    </polyline>

    
    <g transform="translate(200 300)">
      <g>
        <use href="#wheel" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
      </g>
    </g>
    <g transform="translate(400 300)">
      <g>
        <use href="#wheel" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
      </g>
    </g>

    
    <path d="M200,294 L290,288 M200,306 L290,312" stroke="#444" stroke-width="2" stroke-dasharray="3 2">
      <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="0.2s" repeatCount="indefinite" />
    </path>

    
    <g stroke="#d1352b" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="200" y1="300" x2="290" y2="300" />
      <line x1="200" y1="300" x2="255" y2="222" />
      <line x1="290" y1="300" x2="252" y2="212" />
      <line x1="255" y1="222" x2="368" y2="222" />
      <line x1="290" y1="300" x2="372" y2="232" />
      <line x1="366" y1="212" x2="376" y2="240" />
      <line x1="376" y1="240" x2="400" y2="300" />
    </g>
    
    <path d="M368,212 L372,192 L392,196" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="392" cy="196" r="4" fill="#111" />
    
    <path d="M236,208 Q252,202 268,209 L262,214 L240,213 Z" fill="#4a2c1a" />

    
    <circle cx="290" cy="300" r="12" fill="none" stroke="#555" stroke-width="3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 290 300" to="360 290 300" dur="1s" repeatCount="indefinite" />
      <line x1="268" y1="300" x2="312" y2="300" stroke="#333" stroke-width="5" stroke-linecap="round" />
      <rect x="262" y="297" width="12" height="6" rx="2" fill="#222" />
      <rect x="306" y="297" width="12" height="6" rx="2" fill="#222" />
    </g>
    <circle cx="290" cy="300" r="4" fill="#222" />

    
    <path d="M240,182 L200,168 L206,186 L198,198 L242,200 Z" fill="#e8e8e8" stroke="#bbb" stroke-width="1.5" />

    
    <ellipse cx="285" cy="188" rx="56" ry="38" fill="#ffffff" stroke="#cfcfcf" stroke-width="2" transform="rotate(-18 285 188)" />
    <ellipse cx="292" cy="200" rx="34" ry="18" fill="#f3f3f3" transform="rotate(-18 292 200)" />

    
    <path fill="#e63946" d="M310,162 L235,150 L240,162 L312,174 Z">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="         M310,162 L235,150 L240,162 L312,174 Z;         M310,162 L235,140 L242,154 L312,174 Z;         M310,162 L235,150 L240,162 L312,174 Z" />
    </path>

    
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 320 170;-3 320 170;0 320 170;2 320 170;0 320 170" dur="1s" repeatCount="indefinite" />
      <path d="M316,172 C342,150 322,130 340,110" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round" />
      <path d="M316,172 C342,150 322,130 340,110" stroke="#cfcfcf" stroke-width="1" fill="none" opacity="0.6" />
      <rect x="306" y="160" width="20" height="14" rx="4" fill="#c1121f" transform="rotate(-30 316 167)" />
      <circle cx="345" cy="104" r="18" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5" />
      
      <path d="M336,88 Q330,76 340,80 Q342,72 348,82" fill="#f7e27a" stroke="#d9b94a" stroke-width="1" />
      
      <path d="M358,112 L442,121 Q405,152 360,126 Z" fill="#f7b84a" stroke="#d98b1c" stroke-width="1.5">
        <animate attributeName="d" dur="1s" repeatCount="indefinite" values="           M358,112 L442,121 Q405,152 360,126 Z;           M358,112 L442,121 Q405,158 360,126 Z;           M358,112 L442,121 Q405,152 360,126 Z" />
      </path>
      
      <path d="M355,97 Q400,104 448,118 Q446,124 440,122 L357,113 Z" fill="#f4a300" stroke="#c97c00" stroke-width="1.5" />
      <circle cx="447" cy="119" r="3" fill="#e05a00" />
      
      <circle cx="349" cy="99" r="4" fill="#111" />
      <circle cx="350.3" cy="97.8" r="1.3" fill="#fff" />
    </g>

    
    <polyline fill="none" stroke="#f4a300" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="265,225 316.2,245.1 312,300">
      <animate attributeName="points" dur="1s" repeatCount="indefinite" values="         265,225 316.2,245.1 312,300;         265,225 307,260.6 305.6,315.6;         265,225 299.5,267.8 290,322;         265,225 300.4,267.1 274.4,315.6;         265,225 306.7,260.9 268,300;         265,225 315.2,247.5 274.4,284.4;         265,225 319.5,231.6 290,278;         265,225 319.7,231.2 305.6,284.4;         265,225 316.2,245.1 312,300" />
    </polyline>

    
    <path d="M262,168 Q320,160 392,194 Q350,206 290,204 Q262,196 262,168 Z" fill="#e4e4e4" stroke="#b5b5b5" stroke-width="1.5" />
    <path d="M280,190 Q320,195 360,198 M285,180 Q320,182 350,188" stroke="#bdbdbd" stroke-width="1.5" fill="none" />
    <path d="M300,200 L292,212 L306,204 L302,214 L316,203 Z" fill="#555" />
  </g>
</svg>