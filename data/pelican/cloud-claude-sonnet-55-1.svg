<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff" />
      <stop offset="1" stop-color="#eaf8ff" />
    </linearGradient>
    <g id="wheel">
      <circle r="38" fill="none" stroke="#222" stroke-width="5" />
      <circle r="33" fill="none" stroke="#888" stroke-width="1" />
      <circle r="4" fill="#222" />
      <g stroke="#777" stroke-width="1.5">
        <line x1="-33" y1="0" x2="33" y2="0" />
        <line x1="0" y1="-33" x2="0" y2="33" />
        <line x1="-23" y1="-23" x2="23" y2="23" />
        <line x1="-23" y1="23" x2="23" y2="-23" />
      </g>
    </g>
  </defs>

  <rect width="400" height="300" fill="url(#sky)" />

  
  <circle cx="340" cy="50" r="22" fill="#ffd54a">
    <animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite" />
  </circle>

  
  <g fill="#fff" opacity="0.9">
    <g>
      <ellipse cx="0" cy="0" rx="28" ry="10" />
      <ellipse cx="14" cy="-8" rx="16" ry="9" />
      <ellipse cx="-12" cy="-6" rx="14" ry="8" />
      <animateTransform attributeName="transform" type="translate" values="-60 60;460 60" dur="22s" repeatCount="indefinite" />
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="22" ry="8" />
      <ellipse cx="10" cy="-7" rx="12" ry="7" />
      <animateTransform attributeName="transform" type="translate" values="-60 110;460 110" dur="30s" begin="-12s" repeatCount="indefinite" />
    </g>
  </g>

  
  <rect y="252" width="400" height="48" fill="#8bc16a" />
  <rect y="250" width="400" height="4" fill="#6aa04f" />
  <g stroke="#fff" stroke-width="3" stroke-dasharray="20 20">
    <line x1="0" y1="275" x2="400" y2="275">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="0.5s" repeatCount="indefinite" />
    </line>
  </g>

  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite" />

    
    <g transform="translate(120 212)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
      </use>
    </g>
    <g transform="translate(280 212)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
      </use>
    </g>

    
    <g stroke="#d32f2f" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="120" y1="212" x2="170" y2="165" />
      <line x1="170" y1="165" x2="245" y2="165" />
      <line x1="170" y1="165" x2="200" y2="212" />
      <line x1="245" y1="165" x2="200" y2="212" />
      <line x1="120" y1="212" x2="200" y2="212" />
      <line x1="245" y1="165" x2="280" y2="212" />
      <line x1="245" y1="165" x2="238" y2="140" />
    </g>
    
    <path d="M232 140 L248 138" stroke="#222" stroke-width="5" stroke-linecap="round" />
    
    <path d="M155 160 L185 160" stroke="#222" stroke-width="7" stroke-linecap="round" />
    <line x1="170" y1="165" x2="168" y2="160" stroke="#d32f2f" stroke-width="5" />

    
    <circle cx="200" cy="212" r="10" fill="#555" />
    <g transform="translate(200 212)">
      <g>
        <line x1="0" y1="0" x2="0" y2="22" stroke="#333" stroke-width="4" stroke-linecap="round" />
        <line x1="0" y1="0" x2="0" y2="-22" stroke="#333" stroke-width="4" stroke-linecap="round" />
        <rect x="-7" y="20" width="14" height="5" fill="#222">
          <animateTransform attributeName="transform" type="rotate" from="0 0 22" to="-360 0 22" dur="1s" repeatCount="indefinite" />
        </rect>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
      </g>
    </g>

    
    
    <path d="M150 150 L128 160 L150 165 Z" fill="#cfd8dc" />
    
    <ellipse cx="180" cy="140" rx="38" ry="24" fill="#fafafa" stroke="#b0bec5" stroke-width="2" />
    
    <path d="M165 130 Q185 155 205 135 Q190 120 165 130 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" values="-4 170 130;6 170 130;-4 170 130" dur="0.5s" repeatCount="indefinite" />
    </path>
    
    <g>
      <path d="M180 158 L195 190" stroke="#ff9800" stroke-width="5" stroke-linecap="round">
        <animate attributeName="d" values="M180 158 L195 190;M180 158 L205 200;M180 158 L195 190;M180 158 L190 182;M180 158 L195 190" dur="1s" repeatCount="indefinite" />
      </path>
      <ellipse cx="200" cy="195" rx="9" ry="3.5" fill="#ff9800">
        <animate attributeName="cy" values="192;200;192;180;192" dur="1s" repeatCount="indefinite" />
        <animate attributeName="cx" values="198;206;198;192;198" dur="1s" repeatCount="indefinite" />
      </ellipse>
    </g>
    
    <path d="M205 128 Q235 118 228 95 Q224 80 232 72" fill="none" stroke="#fafafa" stroke-width="13" stroke-linecap="round" />
    <path d="M205 128 Q235 118 228 95 Q224 80 232 72" fill="none" stroke="#b0bec5" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 232 72;2 232 72;-2 232 72" dur="1s" repeatCount="indefinite" />
      <circle cx="236" cy="70" r="13" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5" />
      
      <path d="M244 66 L300 74 Q300 82 292 84 L246 80 Z" fill="#ffb74d" stroke="#e65100" stroke-width="1.5" />
      
      <path d="M246 80 Q272 104 294 85 L246 80 Z" fill="#ffa726" stroke="#e65100" stroke-width="1.5" />
      
      <circle cx="239" cy="66" r="3.5" fill="#222" />
      <circle cx="240" cy="65" r="1.2" fill="#fff" />
      
      <path d="M226 60 Q216 50 220 46 Q226 52 230 58 Z" fill="#cfd8dc" />
    </g>
    
    <path d="M200 135 Q225 140 240 139" stroke="#cfd8dc" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>
</svg>