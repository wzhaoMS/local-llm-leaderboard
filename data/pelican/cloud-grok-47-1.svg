    <path d="M800 324 Q820 312 840 324 T880 324 T920 324 T960 324 T1000 324 T1040 324 T1080 324 T1120 324 T1160 324 T1200 324 T1240 324 T1280 324 T1320 324 T1360 324 T1400 324 T1440 324 T1480 324 T1520 324 T1560 324 T1600 324" stroke="#E9F8FF" stroke-width="2.4" opacity="0.85" />
    <path d="M0 342 Q20 334 40 342 T80 342 T120 342 T160 342 T200 342 T240 342 T280 342 T320 342 T360 342 T400 342 T440 342 T480 342 T520 342 T560 342 T600 342 T640 342 T680 342 T720 342 T760 342 T800 342" stroke="#B7E7F8" stroke-width="2" opacity="0.7" />
    <path d="M800 342 Q820 334 840 342 T880 342 T920 342 T960 342 T1000 342 T1040 342 T1080 342 T1120 342 T1160 342 T1200 342 T1240 342 T1280 342 T1320 342 T1360 342 T1400 342 T1440 342 T1480 342 T1520 342 T1560 342 T1600 342" stroke="#B7E7F8" stroke-width="2" opacity="0.7" />
