<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <title>Pelican riding a bicycle</title>
  <desc>A white pelican with an orange pouch pedals a red bicycle along a beach while the wheels, pedals, and background scroll.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC5F5" />
      <stop offset="58%" stop-color="#B9E6FB" />
      <stop offset="100%" stop-color="#E7F6FF" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EC4E6" />
      <stop offset="100%" stop-color="#1E86C4" />
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D7A6" />
      <stop offset="100%" stop-color="#E7BC84" />
    </linearGradient>
    <radialGradient id="body" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EBE0" />
    </radialGradient>
  </defs>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 0.8s linear infinite; }
    .counterspin { transform-box: fill-box; transform-origin: center; animation: spin 0.8s linear infinite reverse; }
    .rays { transform-box: fill-box; transform-origin: center; animation: spin 28s linear infinite; }
    .bounce { animation: bob 0.4s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.15s ease-in-out infinite; }
    .pouch { transform-box: fill-box; transform-origin: 50% 10%; animation: jiggle 1.25s ease-in-out infinite; }
    .fish { transform-box: fill-box; transform-origin: 15% 50%; animation: wiggle 0.34s ease-in-out infinite; }
    .lid { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: squash 0.4s ease-in-out infinite; }
    .drift { animation: drift 32s linear infinite; }
    .waves { animation: drift 6s linear infinite; }
    .dashes { stroke-dasharray: 16 18; animation: march 0.45s linear infinite; }
    .speed { animation: zoom 0.7s linear infinite; }
    .gull { animation: gfly 24s linear infinite; }
    .gull-l { transform-box: fill-box; transform-origin: 100% 50%; animation: flapL 0.5s ease-in-out infinite; }
    .gull-r { transform-box: fill-box; transform-origin: 0% 50%; animation: flapR 0.5s ease-in-out infinite; }
    .boat { animation: boat 26s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes flap { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-24deg); } }
    @keyframes jiggle { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 1.08); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
    @keyframes blink { 0%, 91%, 100% { transform: scaleY(0.04); } 95% { transform: scaleY(1); } }
    @keyframes squash { 0%, 100% { transform: scaleX(1); opacity: 0.2; } 50% { transform: scaleX(0.86); opacity: 0.13; } }
    @keyframes drift { to { transform: translateX(-800px); } }
    @keyframes march { to { stroke-dashoffset: -34; } }
    @keyframes zoom { 0% { transform: translateX(16px); opacity: 0; } 25% { opacity: 0.55; } 100% { transform: translateX(-36px); opacity: 0; } }
    @keyframes gfly { from { transform: translate(780px, 92px); } to { transform: translate(-80px, 64px); } }
    @keyframes flapL { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-32deg); } }
    @keyframes flapR { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(32deg); } }
    @keyframes boat { from { transform: translateX(0); } to { transform: translateX(-140px); } }
  </style>

  <rect width="800" height="500" fill="url(#sky)" />

